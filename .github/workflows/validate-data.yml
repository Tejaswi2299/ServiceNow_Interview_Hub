name: Validate interview hub data

on:
  push:
    branches: [ main, master, work ]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate content and mappings
        run: node scripts/validate-data.mjs
